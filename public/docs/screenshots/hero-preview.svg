<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="auto">
  <defs>
    <radialGradient id="bgGrad1" cx="12%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#5977cd" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGrad2" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#53a59b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090c12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#849ff3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5066ab" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9bb4ff"/>
      <stop offset="100%" stop-color="#c0d0ff"/>
    </linearGradient>
  </defs>

  <!-- Fondo general -->
  <rect width="940" height="540" fill="#090c12"/>
  <rect width="940" height="540" fill="url(#bgGrad1)"/>
  <rect width="940" height="540" fill="url(#bgGrad2)"/>

  <!-- Topbar -->
  <g transform="translate(40, 32)">
    <!-- Brand Mark -->
    <rect x="0" y="0" width="36" height="36" rx="12" fill="rgba(155, 180, 255, 0.12)" stroke="rgba(155, 180, 255, 0.45)" stroke-width="1"/>
    <line x1="9" y1="13" x2="27" y2="13" stroke="#9bb4ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="21" x2="27" y2="21" stroke="#9bb4ff" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round"/>
    <text x="48" y="18" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2.5">FOCUS</text>
    <text x="48" y="32" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="11">Motor binaural estéreo &amp; síntesis adaptativa</text>

    <!-- Top indicators -->
    <rect x="630" y="4" width="112" height="28" rx="14" fill="rgba(18, 23, 34, 0.55)" stroke="rgba(161, 178, 219, 0.16)"/>
    <text x="686" y="22" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">DSP Estéreo Activo</text>

    <rect x="752" y="4" width="108" height="28" rx="14" fill="rgba(18, 23, 34, 0.65)" stroke="rgba(140, 229, 197, 0.28)"/>
    <circle cx="768" cy="18" r="3.5" fill="#8ce5c5"/>
    <text x="812" y="22" fill="#c7f5e4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Sonando</text>
  </g>

  <!-- Layout: 2 Tarjetas principales -->
  <g transform="translate(40, 85)">
    <!-- Tarjeta Reproductor (Izquierda) -->
    <rect x="0" y="0" width="395" height="425" rx="22" fill="#121722" fill-opacity="0.88" stroke="rgba(161, 178, 219, 0.14)" stroke-width="1"/>
    
    <text x="197" y="36" fill="#9bb4ff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="2" text-anchor="middle">INMERSIÓN COGNITIVA</text>
    <text x="197" y="66" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Entrá en foco.</text>
    <text x="197" y="86" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Síntesis acústica con imagen estéreo desacoplada.</text>

    <!-- Órbitas de sonido -->
    <g transform="translate(197, 195)">
      <circle r="85" fill="none" stroke="rgba(155, 180, 255, 0.12)" stroke-width="1"/>
      <circle r="68" fill="none" stroke="rgba(155, 180, 255, 0.18)" stroke-width="1"/>
      <circle r="52" fill="none" stroke="rgba(155, 180, 255, 0.25)" stroke-width="1"/>
      <ellipse rx="82" ry="48" fill="none" stroke="rgba(155, 180, 255, 0.12)" transform="rotate(35)"/>
      <ellipse rx="82" ry="48" fill="none" stroke="rgba(155, 180, 255, 0.12)" transform="rotate(-35)"/>

      <!-- Botón de Play Central -->
      <circle r="44" fill="url(#btnGrad)" stroke="rgba(183, 201, 255, 0.75)" stroke-width="1.2"/>
      <!-- Icono Pausa -->
      <rect x="-9" y="-10" width="6" height="20" rx="1.5" fill="#f5f7ff"/>
      <rect x="3" y="-10" width="6" height="20" rx="1.5" fill="#f5f7ff"/>
      <text x="0" y="24" fill="#f5f7ff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" text-anchor="middle">PAUSAR</text>
    </g>

    <!-- Temporizador -->
    <text x="197" y="322" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5" letter-spacing="1" text-anchor="middle">TIEMPO DE SESIÓN (25 MIN)</text>
    <text x="197" y="352" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="600" text-anchor="middle" font-variant-numeric="tabular-nums" letter-spacing="2">00:21:44</text>
    
    <!-- Chips de modo -->
    <g transform="translate(48, 372)">
      <rect x="0" y="0" width="64" height="24" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(161, 178, 219, 0.14)"/>
      <text x="32" y="16" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Libre</text>

      <rect x="74" y="0" width="70" height="24" rx="12" fill="rgba(155, 180, 255, 0.12)" stroke="rgba(155, 180, 255, 0.45)"/>
      <text x="109" y="16" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">25 min</text>

      <rect x="154" y="0" width="70" height="24" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(161, 178, 219, 0.14)"/>
      <text x="189" y="16" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">45 min</text>

      <rect x="234" y="0" width="65" height="24" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(161, 178, 219, 0.14)"/>
      <text x="266.5" y="16" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">60 min</text>
    </g>

    <!-- Tarjeta Mezclador (Derecha) -->
    <g transform="translate(415, 0)">
      <rect x="0" y="0" width="445" height="425" rx="22" fill="#121722" fill-opacity="0.88" stroke="rgba(161, 178, 219, 0.14)" stroke-width="1"/>

      <!-- Encabezado Mezclador -->
      <text x="24" y="32" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Mezclador de ambiente</text>
      <text x="24" y="48" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="11">Ajustá cada capa acústica en tiempo real sin cortes.</text>

      <!-- Bloque Maestro -->
      <g transform="translate(24, 65)">
        <rect x="0" y="0" width="397" height="58" rx="14" fill="rgba(155, 180, 255, 0.05)" stroke="rgba(155, 180, 255, 0.18)"/>
        <text x="16" y="24" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Volumen maestro</text>
        <text x="381" y="24" fill="#c0d0ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">75%</text>
        <!-- Slider track -->
        <rect x="16" y="36" width="365" height="5" rx="2.5" fill="rgba(142, 152, 176, 0.2)"/>
        <rect x="16" y="36" width="273" height="5" rx="2.5" fill="#9bb4ff"/>
        <circle cx="289" cy="38.5" r="7" fill="#829df0" stroke="#dce5ff" stroke-width="2.5"/>
      </g>

      <!-- Capas de Audio -->
      <!-- Capa 1: Ruido Marrón -->
      <g transform="translate(24, 138)">
        <rect x="0" y="0" width="28" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(161,178,219,0.12)"/>
        <path d="M6 14c2-2 4-2 6 0s4 2 6 0" stroke="#9bb4ff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <text x="36" y="13" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ruido marrón estéreo</text>
        <text x="36" y="26" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5">Doble canal desacoplado con oleaje orgánico</text>
        <text x="397" y="14" fill="#aeb8cd" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="end">70%</text>
        <rect x="0" y="36" width="397" height="4" rx="2" fill="rgba(142, 152, 176, 0.2)"/>
        <rect x="0" y="36" width="278" height="4" rx="2" fill="#9bb4ff"/>
        <circle cx="278" cy="38" r="6" fill="#829df0" stroke="#dce5ff" stroke-width="2"/>
      </g>

      <!-- Capa 2: Drone Armónico -->
      <g transform="translate(24, 196)">
        <rect x="0" y="0" width="28" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(161,178,219,0.12)"/>
        <path d="M6 14h3l2-5 4 10 3-8 2 3h2" stroke="#9bb4ff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <text x="36" y="13" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Drone armónico cálido</text>
        <text x="36" y="26" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5">Sub-bajo + quinta justa con filtro respiratorio</text>
        <text x="397" y="14" fill="#aeb8cd" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="end">60%</text>
        <rect x="0" y="36" width="397" height="4" rx="2" fill="rgba(142, 152, 176, 0.2)"/>
        <rect x="0" y="36" width="238" height="4" rx="2" fill="#9bb4ff"/>
        <circle cx="238" cy="38" r="6" fill="#829df0" stroke="#dce5ff" stroke-width="2"/>
      </g>

      <!-- Capa 3: Notas Pentatónicas -->
      <g transform="translate(24, 254)">
        <rect x="0" y="0" width="28" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(161,178,219,0.12)"/>
        <circle cx="10" cy="18" r="2.5" fill="#9bb4ff"/>
        <circle cx="18" cy="15" r="2.5" fill="#9bb4ff"/>
        <path d="M12.5 18V9l8-2v8" stroke="#9bb4ff" stroke-width="1.3" fill="none"/>
        <text x="36" y="13" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Notas pentatónicas espaciales</text>
        <text x="36" y="26" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5">Paneo estéreo y reverberación suave</text>
        <text x="397" y="14" fill="#aeb8cd" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="end">55%</text>
        <rect x="0" y="36" width="397" height="4" rx="2" fill="rgba(142, 152, 176, 0.2)"/>
        <rect x="0" y="36" width="218" height="4" rx="2" fill="#9bb4ff"/>
        <circle cx="218" cy="38" r="6" fill="#829df0" stroke="#dce5ff" stroke-width="2"/>
      </g>

      <!-- Divisor y Perfiles -->
      <line x1="24" y1="316" x2="421" y2="316" stroke="rgba(161, 178, 219, 0.12)"/>
      <text x="24" y="336" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PERFILES ACÚSTICOS</text>

      <g transform="translate(24, 348)">
        <rect x="0" y="0" width="124" height="46" rx="10" fill="rgba(155, 180, 255, 0.08)" stroke="rgba(155, 180, 255, 0.45)"/>
        <text x="62" y="27" fill="#eef2ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Equilibrado</text>

        <rect x="136" y="0" width="124" height="46" rx="10" fill="rgba(255,255,255,0.018)" stroke="rgba(161, 178, 219, 0.14)"/>
        <text x="198" y="22" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Aislamiento</text>
        <text x="198" y="34" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">profundo</text>

        <rect x="272" y="0" width="124" height="46" rx="10" fill="rgba(255,255,255,0.018)" stroke="rgba(161, 178, 219, 0.14)"/>
        <text x="334" y="22" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Inmersión</text>
        <text x="334" y="34" fill="#8e98b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">sutil</text>
      </g>
    </g>
  </g>
</svg>
