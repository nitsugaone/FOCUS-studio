name: FOCUS quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: focus-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run regression and signal tests
        run: node --test tests/*.test.mjs
  browser:
    needs: unit
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/browser-tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Run browser checks
        run: npm test
      - name: Save browser report and screenshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: focus-browser-report
          path: |
            tools/browser-tests/playwright-report/
            tools/browser-tests/test-results/
          retention-days: 7
