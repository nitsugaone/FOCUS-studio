name: FOCUS quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: focus-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run regression and signal tests
        run: npm test
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run Node checks on Windows
        run: npm test
      - name: Install application build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check build configuration types
        run: npm run lint
      - name: Build for the deployed subpath
        run: npm run build -- --base=/FOCUS-studio/
      - name: Validate emitted bundle and offline assets
        run: npm run validate:build
      - name: Clean the Windows build output
        run: npm run clean
      - name: Verify cleanup preserves the checkout
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'dist') { throw 'Build output was not removed' }
          if (-not (Test-Path -LiteralPath 'src/main.js' -PathType Leaf)) { throw 'Application entry is missing' }
          if (-not (Test-Path -LiteralPath 'package.json' -PathType Leaf)) { throw 'Project manifest is missing' }
  build:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install application build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check build configuration types
        run: npm run lint
      - name: Build the production application for its deployed subpath
        run: npm run build -- --base=/FOCUS-studio/
      - name: Validate emitted bundle and offline assets
        run: npm run validate:build
      - uses: actions/upload-artifact@v4
        with:
          name: focus-production-build
          path: dist/
          retention-days: 7
  browser:
    needs: [unit, build]
    strategy:
      fail-fast: false
      matrix:
        target: [source, build]
    env:
      FOCUS_TEST_TARGET: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        if: matrix.target == 'build'
        with:
          name: focus-production-build
          path: dist/
      - name: Install pinned browser test dependency
        working-directory: tools/browser-tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run browser checks
        run: npm run test:browser
      - name: Save browser report and screenshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: focus-browser-report-${{ matrix.target }}
          path: |
            tools/browser-tests/playwright-report/
            tools/browser-tests/test-results/
          retention-days: 7
