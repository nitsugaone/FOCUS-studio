name: Resolve dependency locks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve root lock without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve browser lock without executing package scripts
        run: npm --prefix tools/browser-tests install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export public lockfile metadata for review
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for(const [label,path] of [['ROOT','package-lock.json'],['BROWSER','tools/browser-tests/package-lock.json']]) {
            console.log('FOCUS_LOCK_'+label+'_BEGIN');
            console.log(readFileSync(path,'utf8'));
            console.log('FOCUS_LOCK_'+label+'_END');
          }
          NODE
